<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Engineering Course</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --border: #334155;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
        
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-section {
            margin-bottom: 1.5rem;
        }
        
        .nav-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            padding-left: 0.5rem;
        }
        
        .nav-item {
            display: block;
            padding: 0.6rem 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        
        .nav-item:hover {
            background: var(--border);
            color: var(--text);
        }
        
        .nav-item.active {
            background: var(--accent);
            color: white;
        }
        
        .nav-number {
            display: inline-block;
            width: 1.5rem;
            color: var(--accent);
            font-weight: 600;
        }
        
        .nav-item.active .nav-number {
            color: white;
        }
        
        /* Main Content */
        .main {
            padding: 2rem 4rem;
            max-width: 1000px;
        }
        
        .content h1 {
            font-size: 2.25rem;
            margin-bottom: 1.5rem;
            color: var(--text);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.75rem;
        }
        
        .content h2 {
            font-size: 1.6rem;
            margin: 2.5rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--accent-hover);
        }
        
        .content h3 {
            font-size: 1.3rem;
            margin: 2rem 0 0.75rem;
            color: var(--text);
        }
        
        .content h4 {
            font-size: 1.1rem;
            margin: 1.5rem 0 0.5rem;
            color: var(--accent-hover);
        }
        
        .content p {
            margin-bottom: 1.25rem;
            color: var(--text-muted);
        }
        
        .content ul, .content ol {
            margin: 0 0 1.25rem 1.5rem;
            color: var(--text-muted);
        }
        
        .content li {
            margin-bottom: 0.6rem;
        }
        
        .content li::marker {
            color: var(--accent);
        }
        
        .content strong {
            color: var(--text);
            font-weight: 600;
        }
        
        .content code {
            background: var(--bg-secondary);
            padding: 0.2em 0.5em;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--accent-hover);
            font-family: 'SF Mono', Monaco, monospace;
        }
        
        .content pre {
            background: var(--bg-secondary);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }
        
        .content pre code {
            background: none;
            padding: 0;
        }
        
        .content blockquote {
            border-left: 4px solid var(--accent);
            padding: 1rem 1.25rem;
            margin: 1.5rem 0;
            background: var(--bg-secondary);
            border-radius: 0 8px 8px 0;
        }
        
        .content blockquote p {
            margin: 0;
        }
        
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }
        
        .content th, .content td {
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            text-align: left;
        }
        
        .content th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text);
        }
        
        .content td {
            color: var(--text-muted);
        }
        
        .content hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 3rem 0;
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* Mobile */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: fixed;
                left: -100%;
                width: 300px;
                z-index: 100;
                transition: left 0.3s;
            }
            .sidebar.open {
                left: 0;
            }
            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 99;
            }
            .overlay.show {
                display: block;
            }
            .menu-toggle {
                display: flex !important;
            }
            .main {
                padding: 5rem 1.5rem 2rem;
            }
        }
        
        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 101;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            align-items: center;
            gap: 0.5rem;
        }

        .tool-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin: 1rem 0 1.5rem;
        }

        .tool-input {
            width: min(100%, 420px);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 0.75rem 0.85rem;
            font: inherit;
        }

        .result-item {
            border-top: 1px solid var(--border);
            padding: 1rem 0;
        }

        .result-meta {
            color: var(--accent-hover);
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
        }

        .graph-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            margin: 1rem 0 1.5rem;
        }

        .graph-svg {
            display: block;
            min-width: 760px;
            width: 100%;
            height: 520px;
        }

        .graph-edge {
            stroke: var(--border);
            stroke-width: 1.5;
        }

        .graph-node {
            stroke: var(--bg);
            stroke-width: 2;
        }

        .graph-label {
            fill: var(--text);
            font-size: 12px;
            paint-order: stroke;
            stroke: var(--bg-secondary);
            stroke-width: 4px;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="logo">⚙️ CNC Engineering Course</div>
            <div id="nav-content">
                <p style="color: var(--text-muted); padding: 1rem;">Loading...</p>
            </div>
        </nav>
        
        <main class="main">
            <div class="content" id="content">
                <div class="loading">Loading course content</div>
            </div>
        </main>
    </div>

    <script>
        const MODULES = [
            { num: '01', title: 'Mechanical Frame and Structure', pdf: 'Module-01-Mechanical-Frame-and-Structure.pdf' },
            { num: '02', title: 'Vertical Axis and Z-Stage', pdf: 'Module-02-Vertical-Axis-and-Z-Stage.pdf' },
            { num: '03', title: 'Linear Motion Systems', pdf: 'Module-03-Linear-Motion-Systems.pdf' },
            { num: '04', title: 'Control Electronics', pdf: 'Module-04-Control-Electronics.pdf' },
            { num: '05', title: 'Plasma Cutting', pdf: 'Module-05-Plasma-Cutting.pdf' },
            { num: '06', title: 'Spindle and Rotary Tools', pdf: 'Module-06-Spindle-and-Rotary-Tools.pdf' },
            { num: '07', title: 'Fiber Laser', pdf: 'Module-07-Fiber-Laser.pdf' },
            { num: '08', title: 'Waterjet Cutting', pdf: 'Module-08-Waterjet-Cutting.pdf' },
            { num: '09', title: 'Pick and Place Robot', pdf: 'Module-09-Pick-and-Place-Robot.pdf' },
            { num: '10', title: 'Robotic Arm', pdf: 'Module-10-Robotic-Arm.pdf' },
            { num: '11', title: 'Large-Format FDM 3D Printing', pdf: 'Module-11-Large-Format-FDM-3D-Printing.pdf' },
            { num: '12', title: 'Water-Jet Guided Laser Cutting', pdf: 'Module-12-Water-Jet-Guided-Laser-Cutting.pdf' },
            { num: '13', title: 'EMI/EMC for Motion Control', pdf: 'Module-13-EMI-EMC-for-Motion-Control.pdf' },
            { num: '14', title: 'LinuxCNC HAL and Real-Time Control', pdf: 'Module-14-LinuxCNC-HAL-and-Real-Time-Control.pdf' },
            { num: '15', title: 'G-Code Standards and Post-Processing', pdf: 'Module-15-G-Code-Standards-and-Post-Processing.pdf' },
            { num: '16', title: 'CAD Design for Manufacturable Parts', pdf: 'Module-16-CAD-Design-for-Manufacturable-Parts.pdf' },
            { num: '17', title: 'Advanced Materials: Composites and Ceramics', pdf: 'Module-17-Advanced-Materials-Composites-and-Ceramics.pdf' },
            { num: '18', title: 'Industry 4.0 for CNC Manufacturing', pdf: 'Module-18-Industry-4-0-for-CNC-Manufacturing.pdf' },
            { num: '19', title: 'Advanced Control Systems', pdf: 'Module-19-Advanced-Control-Systems.pdf' },
            { num: '20', title: 'Feeds and Speeds', pdf: 'Module-20-Feeds-and-Speeds.pdf' },
            { num: '21', title: 'Metrology and Precision Measurement', pdf: 'Module-21-Metrology-and-Precision-Measurement.pdf' },
            { num: '22', title: 'Quality Management Systems (QMS)', pdf: 'Module-22-Quality-Management-Systems-QMS.pdf' },
            { num: '23', title: 'Shop Organization and Management', pdf: 'Module-23-Shop-Organization-and-Management.pdf' },
            { num: '24', title: 'L.E.A.N. Strategies for CNC Manufacturing', pdf: 'Module-24-LEAN-Strategies-for-CNC-Manufacturing.pdf' },
            { num: '25', title: 'Work-Life Balance in CNC Manufacturing', pdf: 'Module-25-Work-Life-Balance-in-CNC-Manufacturing.pdf' },
            { num: '26', title: 'CNC Business Ownership and Management', pdf: 'Module-26-CNC-Business-Ownership-and-Management.pdf' }
        ];
        
        const moduleCache = {};
        const dataCache = {};

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        async function loadJson(path) {
            if (!dataCache[path]) {
                const resp = await fetch(path);
                if (!resp.ok) throw new Error(`Could not load ${path}`);
                dataCache[path] = await resp.json();
            }
            return dataCache[path];
        }

        function setActive(selector) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelector(selector)?.classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
        
        function buildNav() {
            const nav = document.getElementById('nav-content');
            let html = '<div class="nav-section"><div class="nav-section-title">Course Modules</div>';
            
            MODULES.forEach(m => {
                html += `<a class="nav-item" data-mod="${m.num}" onclick="loadModule('${m.num}')">
                    <span class="nav-number">${parseInt(m.num)}.</span> ${m.title}
                </a>`;
            });
            
            html += '</div>';
            html += `<div class="nav-section">
                <div class="nav-section-title">Reference</div>
                <a class="nav-item" data-view="home" onclick="showHome()">Course Home</a>
                <a class="nav-item" data-view="glossary" onclick="showGlossary()">Glossary</a>
                <a class="nav-item" data-view="resources" onclick="showResources()">Resources</a>
                <a class="nav-item" data-view="graph" onclick="showLinkGraph()">Link Graph</a>
            </div>`;
            nav.innerHTML = html;
        }
        
        async function loadModule(num) {
            // Update nav
            setActive(`[data-mod="${num}"]`);
            
            // Close mobile sidebar
            closeSidebar();
            
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading module</div>';
            
            // Check cache
            if (moduleCache[num]) {
                content.innerHTML = moduleCache[num];
                return;
            }
            
            try {
                // Fetch the pre-generated module content
                const resp = await fetch(`content/module-${num}.md`);
                if (!resp.ok) throw new Error('Not found');
                
                const md = await resp.text();
                const module = MODULES.find(m => m.num === num);
                const pdfLink = module?.pdf
                    ? `<p><a href="PDFs/${module.pdf}" target="_blank" rel="noopener">Download module PDF</a></p>`
                    : '';
                const html = `${pdfLink}${marked.parse(md)}`;
                moduleCache[num] = html;
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = `
                    <h1>Module ${parseInt(num)}: ${MODULES.find(m => m.num === num)?.title}</h1>
                    <p>Content file not found. Run the build script to generate content.</p>
                `;
            }
        }

        function glossaryMatches(item, query) {
            if (!query) return true;
            const haystack = `${item.term} ${item.category} ${item.definition}`.toLowerCase();
            return haystack.includes(query);
        }

        function renderGlossaryResults() {
            const query = document.getElementById('glossary-search')?.value.toLowerCase().trim() ?? '';
            const data = window.glossaryData ?? [];
            const matches = data.filter(item => glossaryMatches(item, query)).slice(0, 120);
            document.getElementById('glossary-results').innerHTML = matches.map(item => `
                <div class="result-item">
                    <div class="result-meta">${escapeHtml(item.category)}</div>
                    <h3>${escapeHtml(item.term)}</h3>
                    <p>${escapeHtml(item.definition)}</p>
                </div>
            `).join('') || '<p>No glossary terms found.</p>';
        }

        async function showGlossary() {
            setActive('[data-view="glossary"]');
            closeSidebar();
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading glossary</div>';
            const data = await loadJson('data/glossary.json');
            window.glossaryData = data;
            content.innerHTML = `
                <h1>Glossary</h1>
                <p>${data.length} CNC engineering terms from Appendix M.</p>
                <div class="tool-row">
                    <input id="glossary-search" class="tool-input" type="search" placeholder="Search terms, categories, definitions" oninput="renderGlossaryResults()">
                    <a href="PDFs/Appendix-M-glossary.pdf" target="_blank" rel="noopener">Download glossary PDF</a>
                </div>
                <div id="glossary-results"></div>
            `;
            renderGlossaryResults();
        }

        function resourceMatches(item, query) {
            if (!query) return true;
            const haystack = `${item.title} ${item.category} ${item.description}`.toLowerCase();
            return haystack.includes(query);
        }

        function renderResourceResults() {
            const query = document.getElementById('resource-search')?.value.toLowerCase().trim() ?? '';
            const data = window.resourceData ?? [];
            const matches = data.filter(item => resourceMatches(item, query));
            document.getElementById('resource-results').innerHTML = matches.map(item => {
                const title = item.url
                    ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>`
                    : escapeHtml(item.title);
                return `
                    <div class="result-item">
                        <div class="result-meta">${escapeHtml(item.category)}</div>
                        <h3>${title}</h3>
                        <p>${escapeHtml(item.description)}</p>
                    </div>
                `;
            }).join('') || '<p>No resources found.</p>';
        }

        async function showResources() {
            setActive('[data-view="resources"]');
            closeSidebar();
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading resources</div>';
            const data = await loadJson('data/resources.json');
            window.resourceData = data;
            content.innerHTML = `
                <h1>Resources</h1>
                <p>${data.length} books, communities, tools, standards, suppliers, and learning resources from Appendix L.</p>
                <div class="tool-row">
                    <input id="resource-search" class="tool-input" type="search" placeholder="Search books, software, standards, communities" oninput="renderResourceResults()">
                    <a href="PDFs/Appendix-L-resources.pdf" target="_blank" rel="noopener">Download resources PDF</a>
                </div>
                <div id="resource-results"></div>
            `;
            renderResourceResults();
        }

        function nodeColor(kind) {
            return {
                module: '#3b82f6',
                term: '#22c55e',
                resource: '#f59e0b',
                appendix: '#a855f7'
            }[kind] || '#94a3b8';
        }

        function drawGraph(selectedId) {
            const graph = window.linkGraphData;
            const nodeMap = Object.fromEntries(graph.nodes.map(node => [node.id, node]));
            const relatedEdges = graph.edges
                .filter(edge => edge.source === selectedId || edge.target === selectedId)
                .sort((a, b) => (b.weight ?? 1) - (a.weight ?? 1))
                .slice(0, 32);
            const relatedIds = [...new Set([selectedId, ...relatedEdges.flatMap(edge => [edge.source, edge.target])])];
            const nodes = relatedIds.map(id => nodeMap[id]).filter(Boolean);
            const center = { x: 380, y: 250 };
            const radius = 190;
            const positions = {};
            positions[selectedId] = center;
            const outer = nodes.filter(node => node.id !== selectedId);
            outer.forEach((node, index) => {
                const angle = (Math.PI * 2 * index) / Math.max(outer.length, 1) - Math.PI / 2;
                positions[node.id] = {
                    x: center.x + Math.cos(angle) * radius,
                    y: center.y + Math.sin(angle) * radius
                };
            });

            const lines = relatedEdges.map(edge => {
                const a = positions[edge.source];
                const b = positions[edge.target];
                if (!a || !b) return '';
                return `<line class="graph-edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`;
            }).join('');
            const circles = nodes.map(node => {
                const pos = positions[node.id];
                const label = node.label.length > 34 ? `${node.label.slice(0, 31)}...` : node.label;
                const size = node.id === selectedId ? 17 : 11;
                return `
                    <g>
                        <circle class="graph-node" cx="${pos.x}" cy="${pos.y}" r="${size}" fill="${nodeColor(node.kind)}"></circle>
                        <text class="graph-label" x="${pos.x + 15}" y="${pos.y + 4}">${escapeHtml(label)}</text>
                    </g>
                `;
            }).join('');
            document.getElementById('graph-canvas').innerHTML = `${lines}${circles}`;

            document.getElementById('graph-list').innerHTML = relatedEdges.map(edge => {
                const otherId = edge.source === selectedId ? edge.target : edge.source;
                const other = nodeMap[otherId];
                return `
                    <div class="result-item">
                        <div class="result-meta">${escapeHtml(edge.relation)} · weight ${escapeHtml(edge.weight ?? 1)}</div>
                        <strong>${escapeHtml(other?.label ?? otherId)}</strong>
                    </div>
                `;
            }).join('') || '<p>No graph links found.</p>';
        }

        async function showLinkGraph() {
            setActive('[data-view="graph"]');
            closeSidebar();
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading link graph</div>';
            const graph = await loadJson('data/link-graph.json');
            window.linkGraphData = graph;
            const selectable = graph.nodes
                .filter(node => node.kind === 'module' || node.kind === 'appendix')
                .sort((a, b) => a.label.localeCompare(b.label));
            content.innerHTML = `
                <h1>Link Graph</h1>
                <p>${graph.nodes.length} nodes and ${graph.edges.length} links across modules, glossary terms, resources, and appendices.</p>
                <div class="tool-row">
                    <select id="graph-select" class="tool-input" onchange="drawGraph(this.value)">
                        ${selectable.map(node => `<option value="${escapeHtml(node.id)}">${escapeHtml(node.label)}</option>`).join('')}
                    </select>
                    <a href="data/link-graph.json" target="_blank" rel="noopener">Download graph JSON</a>
                </div>
                <div class="graph-wrap">
                    <svg id="graph-canvas" class="graph-svg" viewBox="0 0 760 520"></svg>
                </div>
                <h2>Connected Items</h2>
                <div id="graph-list"></div>
            `;
            drawGraph(selectable[0]?.id ?? 'module-01');
        }
        
        function showHome() {
            setActive('[data-view="home"]');
            closeSidebar();
            document.getElementById('content').innerHTML = `
                <h1>CNC Engineering Course</h1>
                <p>A comprehensive professional guide to designing, building, and optimizing CNC gantry systems.</p>
                <p><a href="PDFs/CNC-Engineering-Course-Compendium.pdf" target="_blank" rel="noopener"><strong>Download the complete 3,190-page compendium PDF</strong></a></p>
                <p><a href="#" onclick="showGlossary(); return false;">Search the glossary</a> · <a href="#" onclick="showResources(); return false;">Browse resources</a> · <a href="#" onclick="showLinkGraph(); return false;">Explore the link graph</a></p>
                
                <h2>Course Structure</h2>
                <p>This course contains <strong>26 in-depth modules</strong> covering every aspect of CNC machine design and operation.</p>
                
                <h3>Foundation Modules (1-4)</h3>
                <ul>
                    <li><strong>Module 1:</strong> Mechanical Frame and Structure</li>
                    <li><strong>Module 2:</strong> Vertical Axis and Z-Stage</li>
                    <li><strong>Module 3:</strong> Linear Motion Systems</li>
                    <li><strong>Module 4:</strong> Control Electronics</li>
                </ul>
                
                <h3>Tool-Specific Modules (5-8)</h3>
                <ul>
                    <li><strong>Module 5:</strong> Plasma Cutting</li>
                    <li><strong>Module 6:</strong> Spindle and Rotary Tools</li>
                    <li><strong>Module 7:</strong> Fiber Laser</li>
                    <li><strong>Module 8:</strong> Waterjet Cutting</li>
                </ul>
                
                <h3>Advanced and Hybrid Systems (9-12)</h3>
                <ul>
                    <li><strong>Module 9:</strong> Pick and Place Robot</li>
